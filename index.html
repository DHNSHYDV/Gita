<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gita - Timeless Wisdom for a Better You</title>
    <!-- Google Fonts for Serene Typography & Indian Scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Critical Launch Theme Styling: Zero-Flash Guarantee from Frame 0 -->
    <style>
      html, body {
        background-color: #F6F1EA;
        color: #2A241E;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #141210;
          color: #E8E0D2;
        }
      }
      html.dark, html.dark body {
        background-color: #141210 !important;
        color: #E8E0D2 !important;
      }
      #root {
        width: 100%;
        height: 100%;
        background-color: inherit;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gita_theme');
          var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#141210';
            document.body.style.backgroundColor = '#141210';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F6F1EA';
            document.body.style.backgroundColor = '#F6F1EA';
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preload" as="image" href="/splash_artwork.png" />
    <link rel="preload" as="image" href="/logo.png" />
    <link rel="preload" as="image" href="/peacock.svg" />
  </head>
  <body class="bg-[#F6F1EA] dark:bg-[#141210] text-[#2A241E] dark:text-[#E8E0D2] antialiased selection:bg-[#E8D5B5] selection:text-[#3E2723]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
